<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <form id="search" class="glass search">
      <input id="city" type="text" placeholder="Search city…" autocomplete="off">
      <button type="submit">Go</button>
    </form>

    <section class="glass current">
      <h1 id="place">Boca Raton</h1>
      <div id="temp" class="temp">--°</div>
      <div id="desc" class="desc">Loading…</div>
      <div id="hilo" class="hilo"></div>
    </section>

    <section class="glass details">
      <div><span>Feels like</span><strong id="feels">--</strong></div>
      <div><span>Humidity</span><strong id="humidity">--</strong></div>
      <div><span>Wind</span><strong id="wind">--</strong></div>
    </section>

    <section class="glass">
      <h2>7-Day Forecast</h2>
      <ul id="forecast" class="forecast"></ul>
    </section>

    <p id="error" class="error" hidden></p>
    <footer>Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
